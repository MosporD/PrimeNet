<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>NexusCore — Page not found</title>
    <link rel="icon" type="image/png" href="/static/images/favicon-nexuscore.png?v=1" data-page-favicon>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portals.css') }}?v=2.2">
</head>
<body class="portal-page error-page no-constellation-bg">
    <canvas id="constellation-canvas" aria-hidden="true"></canvas>
    <div class="hud-overlay" aria-hidden="true"></div>
    <div class="portal-theme-mount" aria-label="Theme controls"></div>

    <main class="portal-shell">
        <header class="portal-brand">
            <img src="/static/images/nexuscore-logo.png?v=1" alt="NexusCore logo" class="portal-brand-logo">
            <div class="portal-brand-name">NexusCore</div>
        </header>

        <section class="portal-soon-panel" aria-labelledby="error-title">
            <div class="portal-error-code" aria-hidden="true">404</div>
            <div class="portal-soon-kicker">Not found</div>
            <h1 class="portal-soon-title" id="error-title">This page is not on the network</h1>
            <p class="portal-soon-copy">
                The address you opened does not match a NexusCore or PrimeNet route.
                {% if requested_path %}
                Requested path: <code>{{ requested_path }}</code>
                {% endif %}
            </p>
            <div class="portal-soon-actions">
                {% if user %}
                <a class="portal-btn portal-btn-primary" href="/dashboard">Back to dashboard</a>
                <a class="portal-btn" href="/portals">Portals</a>
                {% else %}
                <a class="portal-btn portal-btn-primary" href="/login">Sign in</a>
                {% endif %}
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/constellation.js') }}?v=2.1"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}?v=2.7"></script>
    <script>
        (function () {
            if (window.PrimeNetConstellation) {
                PrimeNetConstellation.initLoginScene(document.getElementById('constellation-canvas'));
            }
        })();
    </script>
</body>
</html>
