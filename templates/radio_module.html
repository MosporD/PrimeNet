<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeNet - {{ module_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/radio_modules.css') }}?v=1.2">
</head>
<body class="radio-module-page"
      data-api-url="{{ api_url }}"
      data-module-kind="{{ module_kind }}"
      data-default-technology="{{ default_technology or 'all' }}">
    <div class="container">
        <header class="radio-topbar">
            <div class="header-content">
                <a href="/dashboard" class="back-link">Dashboard</a>
                <div class="header-left">
                    <h1>{{ module_title }}</h1>
                    <p>{{ module_subtitle }}</p>
                </div>
                <div class="header-right">
                    <span class="user-name">{{ user.username }}</span>
                    <button type="button" class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <main class="main-content radio-main">
            <section class="radio-filters" aria-label="Radio module filters">
                <label>Area
                    <select id="radio-area">
                        <option value="all">All areas</option>
                    </select>
                </label>
                <label>Vendor
                    <select id="radio-vendor">
                        <option value="all">All vendors</option>
                        <option value="nokia">Nokia</option>
                        <option value="huawei">Huawei</option>
                    </select>
                </label>
                <label>Technology
                    <select id="radio-technology">
                        <option value="all">All RATs</option>
                        <option value="2G">2G</option>
                        <option value="3G">3G</option>
                        <option value="4G-FDD">4G FDD</option>
                        <option value="4G-TDD">4G TDD</option>
                        <option value="4G-4G">4G Neighbor</option>
                        <option value="5G">5G</option>
                    </select>
                </label>
                <label>Search
                    <input type="search" id="radio-search" placeholder="Cell, site, issue">
                </label>
                <button type="button" class="btn-primary" id="radio-apply">Apply</button>
            </section>

            <section class="radio-summary" id="radio-summary">
                <div><span>Total</span><strong id="radio-total">-</strong></div>
                <div><span>Critical</span><strong id="radio-critical">-</strong></div>
                <div><span>High</span><strong id="radio-high">-</strong></div>
                <div><span>Medium</span><strong id="radio-medium">-</strong></div>
            </section>

            <section class="radio-module-summary" id="radio-module-summary" aria-label="Issue categories"></section>

            <section class="radio-note" id="radio-note" hidden></section>

            <section class="radio-workbench-layout">
                <div class="radio-table-wrap">
                    <table class="radio-table">
                        <thead>
                            <tr>
                                <th>Severity</th>
                                <th>Score</th>
                                <th>Issue</th>
                                <th>Area</th>
                                <th>Vendor</th>
                                <th>Technology</th>
                                <th>Cells / Site</th>
                                <th>Recommendation</th>
                            </tr>
                        </thead>
                        <tbody id="radio-rows">
                            <tr><td colspan="8">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <aside class="radio-detail" id="radio-detail" aria-label="Issue detail">
                    <p class="radio-detail-placeholder">Select an issue to review evidence and recommended action.</p>
                </aside>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=1.9"></script>
    <script src="{{ url_for('static', filename='js/radio_modules.js') }}?v=1.1"></script>
</body>
</html>
