<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parameter Dictionary - Nokia NCM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/parameter_dictionary.css') }}?v=1.0">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a href="/dashboard" class="back-link">← Dashboard</a>
                    <h1>📚 Parameter Dictionary</h1>
                    <p>Browse and search Nokia MO parameters database</p>
                </div>
                <div class="header-right">
                    <span class="user-name">{{ user.username }}</span>
                    <button onclick="logout()" class="btn-logout">Logout</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="search-section">
                <input type="text" id="search-input" placeholder="Search MO or Parameter..." class="search-box">
                <div class="filter-controls">
                    <select id="category-filter" class="filter-select">
                        <option value="">All Categories</option>
                    </select>
                    <select id="technology-filter" class="filter-select">
                        <option value="">All Technologies</option>
                        <option value="5G">5G</option>
                        <option value="LTE">LTE</option>
                        <option value="WCDMA">WCDMA</option>
                    </select>
                </div>
            </div>

            <div class="mo-stats-bar">
                <div class="mo-stat">
                    <div class="stat-value" id="total-mos">0</div>
                    <div class="stat-label">MO Classes</div>
                </div>
                <div class="mo-stat">
                    <div class="stat-value" id="total-params">0</div>
                    <div class="stat-label">Parameters</div>
                </div>
            </div>

            <div id="mo-list" class="mo-list"></div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=1.0"></script>
    <script src="{{ url_for('static', filename='js/parameter_dictionary.js') }}?v=1.0"></script>
</body>
</html>
