<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Map - Nokia NCM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/network_map.css') }}?v=1.2">
</head>
<body class="map-page">
    <header class="map-header">
        <div class="header-left">
            <a href="/dashboard" class="back-link">← Dashboard</a>
            <h1>🗺️ Network Map</h1>
        </div>
        <div class="header-right">
            <span class="user-name">{{ user.username }}</span>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </header>

    <div class="map-body">
        <!-- Left overlay panel -->
        <div class="left-panel">
            <div class="map-controls">
                <input type="text" id="site-search" placeholder="Search sites..." onkeyup="searchSites()">
                <div class="code-search-row">
                    <input type="number" id="cell-code-search" placeholder="SC / PCI / BCCH..."
                           min="0" oninput="cellCodeSearch()">
                    <button class="clear-code-btn" onclick="clearCodeSearch()" title="Clear code search">✕</button>
                </div>
                <select id="vendor-filter" onchange="filterByVendor()">
                    <option value="all">All Vendors</option>
                    <option value="Nokia">Nokia</option>
                    <option value="Huawei">Huawei</option>
                </select>
                <select id="area-filter" onchange="filterByArea()">
                    <option value="all">All Areas</option>
                </select>
                <select id="cluster-filter" onchange="filterByCluster()">
                    <option value="all">All Clusters</option>
                </select>
                <button id="refresh-btn" class="refresh-btn" onclick="refreshMetadata()"
                        title="Pull latest metadata from server">
                    ↻ Refresh Data
                </button>
            </div>

            <div id="tech-filter" class="tech-filter"></div>

            <div class="network-stats">
                <div class="stat-card">
                    <div class="stat-value" id="sites-count">0</div>
                    <div class="stat-label">Sites</div>
                </div>
            </div>

            <div id="site-info-panel" style="display: none;"></div>
        </div>

        <!-- Full-page map -->
        <div id="network-map"></div>
    </div>

    <div id="kpi-modal">
        <div id="kpi-content">
            <span class="close-modal" onclick="closeKPIModal()">&times;</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=1.0"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}?v=1.4"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initializeMap();
        });
    </script>
</body>
</html>
