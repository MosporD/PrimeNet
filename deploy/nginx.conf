# NexusCore suite — single public HTTP entry (path routing on one host/port).
# Internal processes stay on 8000 / 8001 / 8002 on the Docker network.
#
# Compose publishes PROXY_HTTP_PORT (default 8000) → nginx :80 inside.
# Open (corp typical):
#   http://192.168.97.141:8000/portals
#   http://192.168.97.141:8000/dashboard
#
# Routing:
#   /portals/marketing…  → NexPulse
#   /portals, /login, /admin, /api/platform-admin, /platform_admin… → NexusCore
#   everything else (/dashboard, /api/…, /admin-panel, /static…) → PrimeNet
#
# Set NEXUS_PUBLIC_URL_FROM_REQUEST=1 (compose default) so redirects keep the
# Host the browser already used. Leave NEXUS_COOKIE_DOMAIN empty (same origin).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nexuscore_upstream {
        server nexuscore:8000;
    }
    upstream primenet_upstream {
        server primenet:8001;
    }
    upstream nexpulse_upstream {
        server nexpulse:8002;
    }

    server {
        listen 80 default_server;
        server_name _;

        proxy_http_version 1.1;
        # Use $http_host (keeps :8000). $host strips the port → browsers hit :80
        # which corp policy blocks even when the proxy is published as host:8000→80.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Marketing portal (NexPulse already uses this URL prefix).
        location ^~ /portals/marketing {
            proxy_pass http://nexpulse_upstream;
        }

        # NexusCore lobby + platform admin + central login.
        location ^~ /portals {
            proxy_pass http://nexuscore_upstream;
        }
        location ^~ /login {
            proxy_pass http://nexuscore_upstream;
        }
        location = /admin {
            proxy_pass http://nexuscore_upstream;
        }
        location ^~ /platform_admin/ {
            proxy_pass http://nexuscore_upstream;
        }
        location ^~ /api/platform-admin {
            proxy_pass http://nexuscore_upstream;
        }
        # Login form posts here from NexusCore /login.
        location = /api/login {
            proxy_pass http://nexuscore_upstream;
        }

        # Engineering (PrimeNet) — dashboard, module APIs, static, activation, etc.
        location / {
            proxy_pass http://primenet_upstream;
        }
    }
}
