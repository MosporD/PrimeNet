# NexusCore suite — single public HTTP entry (hostname routing).
# Internal processes stay on 8000 / 8001 / 8002 on the Docker network.
#
# Default hostnames (map in DNS or use *.localhost → 127.0.0.1):
#   nexus.localhost      → NexusCore
#   primenet.localhost   → PrimeNet
#   nexpulse.localhost   → NexPulse
#
# Set matching *_PUBLIC_URL and NEXUS_COOKIE_DOMAIN=.localhost (or .your.domain).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    # Long CM / sync / PM jobs — keep proxy from cutting the request early.
    proxy_connect_timeout 60s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream nexuscore_upstream {
        server nexuscore:8000;
    }
    upstream primenet_upstream {
        server primenet:8001;
    }
    upstream nexpulse_upstream {
        server nexpulse:8002;
    }

    # Shared proxy headers for all portal backends.
    # Prefer Host = public hostname so redirects/cookies stay on the edge name.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    server {
        listen 80;
        server_name nexus.localhost nexus.example.com;

        location / {
            proxy_pass http://nexuscore_upstream;
        }
    }

    server {
        listen 80;
        server_name primenet.localhost primenet.example.com;

        location / {
            proxy_pass http://primenet_upstream;
        }
    }

    server {
        listen 80;
        server_name nexpulse.localhost nexpulse.example.com;

        location / {
            proxy_pass http://nexpulse_upstream;
        }
    }

    # Default: NexusCore lobby (useful when hitting the proxy by IP / localhost).
    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://nexuscore_upstream;
        }
    }
}
