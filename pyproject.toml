[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "venv",
    "sync_downloads",
    "databases",
    "old_files",
    "config_history",
    "generated_reports",
]

[tool.ruff.lint]
# Start conservative; expand categories as noise is addressed.
select = ["E4", "E7", "E9", "F"]
# One-line compound statements are used heavily in SFTP helpers; optional to tighten later.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Flask entrypoint loads dotenv before blueprints that read env at import time.
"app.py" = ["E402"]
# Pilot CLI inserts repo root on sys.path before package imports.
"pm_warehouse/pilot.py" = ["E402"]
