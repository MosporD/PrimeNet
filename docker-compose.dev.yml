# NexusCore / PrimeNet / NexPulse local development (live code mount + auto-reload)
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Production:
#   docker compose up -d --build

services:
  proxy:
    container_name: nexuscore-proxy-dev
    restart: "no"
    depends_on:
      nexuscore:
        condition: service_started
      primenet:
        condition: service_started
      nexpulse:
        condition: service_started

  nexuscore:
    container_name: nexuscore-web-dev
    restart: "no"
    command: ["dev-nexuscore"]
    environment:
      FLASK_DEBUG: "1"
      FLASK_PORT: "8000"
    volumes:
      - nexuscore-data:/data/nexuscore
      - primenet-data:/data
      - .:/app
    healthcheck:
      disable: true

  primenet:
    container_name: primenet-web-dev
    restart: "no"
    command: ["dev-primenet"]
    environment:
      FLASK_DEBUG: "1"
      FLASK_PORT: "8001"
    volumes:
      - primenet-data:/data
      - .:/app
    healthcheck:
      disable: true

  nexpulse:
    container_name: nexpulse-web-dev
    restart: "no"
    command: ["dev-nexpulse"]
    environment:
      FLASK_DEBUG: "1"
      FLASK_PORT: "8002"
    volumes:
      - nexpulse-data:/data/portals
      - primenet-data:/data
      - .:/app
    healthcheck:
      disable: true

  scheduler:
    profiles: ["with-scheduler"]
    container_name: primenet-scheduler-dev
    restart: "no"
    volumes:
      - primenet-data:/data
      - .:/app
