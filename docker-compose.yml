# NexusCore multi-process stack
# Usage:
#   cp .env.example .env   # edit secrets and SFTP credentials
#   docker compose up -d --build
#
# Public entry (reverse proxy — one host port):
#   http://nexus.localhost/portals          (or http://localhost/portals)
#   http://primenet.localhost/dashboard
#   http://nexpulse.localhost/portals/marketing/
# Set NEXUS_COOKIE_DOMAIN=.localhost (or .your.domain) for cross-subdomain SSO.
#
# Direct process ports are not published; use PROXY_HTTP_PORT (default 80).
# For local suite without Docker: python app.py (ports 8000/8001/8002).
#
# Local dev (live reload, no rebuild per code change):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: nexuscore-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nexuscore:
        condition: service_healthy
      primenet:
        condition: service_healthy
      nexpulse:
        condition: service_healthy

  nexuscore:
    build: .
    image: primenet:latest
    container_name: nexuscore-web
    restart: unless-stopped
    command: ["nexuscore"]
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      NCM_DATA_ROOT: /data
      NCM_CONTAINER: "1"
      NCM_BOOTSTRAP_ON_IMPORT: "0"
      NCM_DISABLE_SCHEDULER: "1"
      FLASK_PORT: "8000"
      NEXUSCORE_PUBLIC_URL: "${NEXUSCORE_PUBLIC_URL:-http://nexus.localhost}"
      PRIMENET_PUBLIC_URL: "${PRIMENET_PUBLIC_URL:-http://primenet.localhost}"
      NEXPULSE_PUBLIC_URL: "${NEXPULSE_PUBLIC_URL:-http://nexpulse.localhost}"
      NEXUS_COOKIE_DOMAIN: "${NEXUS_COOKIE_DOMAIN:-.localhost}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    volumes:
      - nexuscore-data:/data/nexuscore
      - primenet-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  primenet:
    build: .
    image: primenet:latest
    container_name: primenet-web
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    command: ["primenet"]
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      NCM_DATA_ROOT: /data
      NCM_CONTAINER: "1"
      NCM_BOOTSTRAP_ON_IMPORT: "0"
      NCM_DISABLE_SCHEDULER: "1"
      FLASK_PORT: "8001"
      PRIMENET_PUBLIC_URL: "${PRIMENET_PUBLIC_URL:-http://primenet.localhost}"
      NEXUSCORE_PUBLIC_URL: "${NEXUSCORE_PUBLIC_URL:-http://nexus.localhost}"
      NEXPULSE_PUBLIC_URL: "${NEXPULSE_PUBLIC_URL:-http://nexpulse.localhost}"
      NEXUS_COOKIE_DOMAIN: "${NEXUS_COOKIE_DOMAIN:-.localhost}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-600}"
    volumes:
      - primenet-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Backward-compatible alias — same image/command as primenet (optional).
  # Prefer the `primenet` service. Kept for scripts that still expect `web`.
  web:
    build: .
    image: primenet:latest
    container_name: primenet-web-alias
    profiles: ["legacy-web"]
    restart: unless-stopped
    command: ["primenet"]
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      NCM_DATA_ROOT: /data
      NCM_CONTAINER: "1"
      NCM_BOOTSTRAP_ON_IMPORT: "0"
      NCM_DISABLE_SCHEDULER: "1"
      FLASK_PORT: "8001"
    volumes:
      - primenet-data:/data

  nexpulse:
    build: .
    image: primenet:latest
    container_name: nexpulse-web
    restart: unless-stopped
    command: ["nexpulse"]
    expose:
      - "8002"
    env_file:
      - .env
    environment:
      NCM_DATA_ROOT: /data
      NCM_CONTAINER: "1"
      NCM_BOOTSTRAP_ON_IMPORT: "0"
      NCM_DISABLE_SCHEDULER: "1"
      FLASK_PORT: "8002"
      NEXPULSE_PUBLIC_URL: "${NEXPULSE_PUBLIC_URL:-http://nexpulse.localhost}"
      NEXUSCORE_PUBLIC_URL: "${NEXUSCORE_PUBLIC_URL:-http://nexus.localhost}"
      PRIMENET_PUBLIC_URL: "${PRIMENET_PUBLIC_URL:-http://primenet.localhost}"
      NEXUS_COOKIE_DOMAIN: "${NEXUS_COOKIE_DOMAIN:-.localhost}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-1}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
    volumes:
      - nexpulse-data:/data/portals
      - primenet-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  scheduler:
    build: .
    image: primenet:latest
    container_name: primenet-scheduler
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    command: ["scheduler"]
    env_file:
      - .env
    environment:
      NCM_DATA_ROOT: /data
      NCM_CONTAINER: "1"
      NCM_RUN_SCHEDULER: "1"
      NCM_DISABLE_SCHEDULER: "0"
    volumes:
      - primenet-data:/data
    depends_on:
      primenet:
        condition: service_healthy
    healthcheck:
      disable: true

  postgres:
    profiles: ["app-db"]
    image: postgres:16-alpine
    container_name: primenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NCM_APP_POSTGRES_DB:-primenet}
      POSTGRES_USER: ${NCM_APP_POSTGRES_USER:-primenet}
      POSTGRES_PASSWORD: ${NCM_APP_POSTGRES_PASSWORD:?set NCM_APP_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NCM_APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - primenet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  primenet-data:
    driver: local
  nexuscore-data:
    driver: local
  nexpulse-data:
    driver: local
  primenet-postgres:
    driver: local
