# PrimeNet production stack
# Usage:
#   cp .env.example .env   # edit secrets and SFTP credentials
#   docker compose up -d --build
#   open http://localhost:8000/dashboard
#
# Local dev (live reload, no rebuild per code change):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    build: .
    image: primenet:latest
    container_name: primenet-web
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    ports:
      - "${PRIMENET_HTTP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      NCM_DATA_ROOT: /data
      NCM_CONTAINER: "1"
      NCM_BOOTSTRAP_ON_IMPORT: "0"
      NCM_DISABLE_SCHEDULER: "1"
      FLASK_PORT: "8000"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-4}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-600}"
    volumes:
      - primenet-data:/data
    healthcheck:
      # Liveness, not readiness: /health returns 503 until an operator activates,
      # which would leave the container permanently unhealthy on a fresh deploy
      # and block the scheduler's depends_on below.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  scheduler:
    build: .
    image: primenet:latest
    container_name: primenet-scheduler
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    command: ["scheduler"]
    env_file:
      - .env
    environment:
      NCM_DATA_ROOT: /data
      NCM_CONTAINER: "1"
      NCM_RUN_SCHEDULER: "1"
      NCM_DISABLE_SCHEDULER: "0"
    volumes:
      - primenet-data:/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true

  postgres:
    profiles: ["app-db"]
    image: postgres:16-alpine
    container_name: primenet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NCM_APP_POSTGRES_DB:-primenet}
      POSTGRES_USER: ${NCM_APP_POSTGRES_USER:-primenet}
      # Required — no default. `docker compose up` fails fast rather than
      # starting a database with a well-known password.
      POSTGRES_PASSWORD: ${NCM_APP_POSTGRES_PASSWORD:?set NCM_APP_POSTGRES_PASSWORD in .env}
    ports:
      # Loopback only. The app reaches Postgres over the compose network, so this
      # mapping exists for local psql access — it must not expose the database
      # on every host interface. Override the host side deliberately if needed.
      - "127.0.0.1:${NCM_APP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - primenet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  primenet-data:
    driver: local
  primenet-postgres:
    driver: local
