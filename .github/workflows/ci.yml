name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.8
      - run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Keep the runner away from checked-in database files; conftest.py supplies
      # the activation/bootstrap flags the suite needs.
      NCM_DATA_ROOT: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: |
          mkdir -p "$NCM_DATA_ROOT"
          pytest core modules -q

  wiring:
    name: app wiring
    runs-on: ubuntu-latest
    env:
      NCM_SKIP_ACTIVATION: "1"
      NCM_BOOTSTRAP_ON_IMPORT: "0"
      NCM_DISABLE_SCHEDULER: "1"
      FLASK_SECRET_KEY: ci-fixed-secret
      NCM_DATA_ROOT: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check blueprints, templates and static refs
        run: |
          mkdir -p "$NCM_DATA_ROOT"
          python scripts/ci_check_wiring.py
