name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.15.8
      - run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    env:
      # Keep the runner away from checked-in database files; conftest.py supplies
      # the activation/bootstrap flags the suite needs.
      NCM_DATA_ROOT: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run unit tests
        run: |
          mkdir -p "$NCM_DATA_ROOT"
          pytest core modules -q
      - name: SQL adapter regression tests
        run: python scripts/test_app_db_adapter.py

  wiring:
    name: app wiring
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: primenet
          POSTGRES_PASSWORD: primenet_ci
          POSTGRES_DB: primenet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primenet -d primenet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NCM_SKIP_ACTIVATION: "1"
      NCM_BOOTSTRAP_ON_IMPORT: "0"
      NCM_DISABLE_SCHEDULER: "1"
      NCM_ENABLE_ETL: "0"
      FLASK_SECRET_KEY: ci-fixed-secret
      NCM_DATA_ROOT: ${{ github.workspace }}/.ci-data
      NCM_DATABASE_URL: postgresql://primenet:primenet_ci@127.0.0.1:5432/primenet
      NCM_CI_ADMIN_PASSWORD: ci-smoke-admin-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Check blueprints, templates and static refs
        run: |
          mkdir -p "$NCM_DATA_ROOT"
          python scripts/ci_check_wiring.py
      - name: SQLite-ism audit (report)
        run: python scripts/audit_sqlite_isms.py
      - name: Module page smoke (no HTTP 500)
        run: python scripts/ci_smoke_routes.py
