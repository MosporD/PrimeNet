<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Discrepancy Audit - PrimeNet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=1.0">
    <link rel="stylesheet" href="{{ url_for('cm_discrepancy_audit.static', filename='cm_discrepancy_audit.css') }}?v=1.0">
</head>
<body data-user-role="{{ user.role }}">
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a href="/dashboard" class="back-link">Dashboard</a>
                    <h1>CM Discrepancy Audit</h1>
                    <p>Daily full-network multi-vendor CM audit against network-consensus common settings</p>
                </div>
                <div class="header-right">
                    <span class="user-name">{{ user.username }}</span>
                    <button onclick="logout()" class="btn-logout">Logout</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="cda-toolbar">
                <div class="cda-field">
                    <label for="cda-vendor">Vendor</label>
                    <select id="cda-vendor">
                        <option value="huawei">Huawei</option>
                        <option value="nokia">Nokia</option>
                    </select>
                </div>
                <div class="cda-field">
                    <label for="cda-run">Run date</label>
                    <select id="cda-run"></select>
                </div>
                <div class="cda-actions">
                    <button type="button" class="btn-primary" id="cda-download-btn">Download Excel</button>
                    <button type="button" class="btn-secondary" id="cda-trigger-btn">Run audit now</button>
                </div>
                <div class="cda-status" id="cda-status" aria-live="polite"></div>
            </section>

            <section class="cda-run-meta" id="cda-run-meta"></section>

            <nav class="cda-tabs" id="cda-tabs">
                <button class="cda-tab active" data-tab="summary">Summary</button>
                <button class="cda-tab" data-tab="master">Master Sheet</button>
                <button class="cda-tab" data-tab="trend">Accumulated Data</button>
                <button class="cda-tab" data-tab="detail">MO Detail</button>
            </nav>

            <section class="cda-panel" id="cda-panel-summary">
                <div class="cda-filter-row">
                    <input type="search" id="cda-summary-search" placeholder="Filter MO / parameter...">
                </div>
                <div class="cda-table-wrap">
                    <table class="cda-table" id="cda-summary-table">
                        <thead><tr><th data-sort="mo">MO</th><th data-sort="parameter">Parameter</th><th data-sort="mismatch_count">No. of Mismatches</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="cda-panel" id="cda-panel-master" hidden>
                <div class="cda-filter-row">
                    <input type="search" id="cda-master-search" placeholder="Filter MO / parameter...">
                </div>
                <div class="cda-table-wrap">
                    <table class="cda-table" id="cda-master-table">
                        <thead><tr><th>MO</th><th>Parameter</th><th>Distribution</th><th>Common Settings</th><th>Unique</th><th>Mismatches</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="cda-panel" id="cda-panel-trend" hidden>
                <div class="cda-chart-wrap"><canvas id="cda-trend-chart" height="90"></canvas></div>
                <div class="cda-table-wrap">
                    <table class="cda-table" id="cda-trend-table">
                        <thead><tr><th>Date</th><th>Total Mismatches</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="cda-panel" id="cda-panel-detail" hidden>
                <div class="cda-filter-row">
                    <select id="cda-detail-mo"></select>
                    <select id="cda-detail-flag">
                        <option value="">All flags</option>
                        <option value="mismatched">Mismatched</option>
                        <option value="added">Added</option>
                        <option value="removed">Removed</option>
                    </select>
                    <div class="cda-pager">
                        <button type="button" class="btn-secondary" id="cda-detail-prev">&laquo;</button>
                        <span id="cda-detail-page">-</span>
                        <button type="button" class="btn-secondary" id="cda-detail-next">&raquo;</button>
                    </div>
                </div>
                <div class="cda-table-wrap">
                    <table class="cda-table" id="cda-detail-table">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=1.0"></script>
    <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('cm_discrepancy_audit.static', filename='cm_discrepancy_audit.js') }}?v=1.0"></script>
</body>
</html>
