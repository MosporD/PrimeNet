<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeNet — Network Health</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=1.5">
    <link rel="stylesheet" href="{{ url_for('network_health.static', filename='network_health.css') }}?v=6.4">
</head>
<body class="nh-page nh-select-page"
      data-default-vendor="{{ default_vendor }}"
      data-default-rat="{{ default_rat }}">
    <header>
        <div class="header-content">
            <a href="/dashboard" class="back-link">Dashboard</a>
            <div class="header-left">
                <h1>Network Health</h1>
                <p>Select vendor and radio access technology</p>
            </div>
            <div class="header-right">
                <span class="user-name">{{ user.username }}</span>
                <button type="button" class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <main class="nh-select-main">
        <section class="nh-select-section" aria-labelledby="nh-vendor-heading">
            <h2 id="nh-vendor-heading" class="nh-select-section-title">Vendor</h2>
            <div class="nh-vendor-grid" id="nh-vendor-grid" role="radiogroup" aria-label="Vendor">
                {% for v in vendors %}
                <button type="button"
                        class="nh-vendor-card{% if v.key == default_vendor %} selected{% endif %}"
                        data-vendor="{{ v.key }}"
                        aria-pressed="{{ 'true' if v.key == default_vendor else 'false' }}">
                    <img src="/parameter_dictionary/static/images/{{ v.key }}_logo.png"
                         alt="{{ v.label }}" class="nh-vendor-logo">
                    <span>{{ v.label }}</span>
                </button>
                {% endfor %}
            </div>
        </section>

        <section class="nh-select-section" aria-labelledby="nh-rat-heading">
            <h2 id="nh-rat-heading" class="nh-select-section-title">Radio Access Technology</h2>
            <div class="nh-rat-grid" id="nh-rat-grid" role="radiogroup" aria-label="RAT">
                {% for r in rats %}
                <button type="button"
                        class="nh-rat-card{% if r.key == default_rat %} selected{% endif %}"
                        data-rat="{{ r.key }}"
                        aria-pressed="{{ 'true' if r.key == default_rat else 'false' }}">
                    <span class="nh-rat-label">{{ r.label }}</span>
                </button>
                {% endfor %}
            </div>
        </section>

        <div class="nh-select-actions">
            <button type="button" class="nh-continue-btn" id="nh-continue-btn">Continue</button>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=2.4"></script>
    <script src="{{ url_for('network_health.static', filename='network_health_select.js') }}?v=1.2"></script>
    <script>
    async function logout() {
        try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
        window.location.href = '/login';
    }
    </script>
</body>
</html>
