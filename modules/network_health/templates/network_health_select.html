<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeNet — Network Health</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=2.0">
    <link rel="stylesheet" href="{{ url_for('network_health.static', filename='network_health.css') }}?v=7.6">
</head>
<body class="nh-page nh-select-page nh-wizard-page"
      data-default-vendor="{{ default_vendor }}">
    <header>
        <div class="header-content">
            <a href="/dashboard" class="back-link">Dashboard</a>
            <div class="header-left">
                <h1>Network Benchmarking Dashboard</h1>
                <p>Select vendor</p>
            </div>
            <div class="header-right">
                <span class="user-name">{{ user.username }}</span>
                <button type="button" class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <main class="nh-select-main nh-wizard-main">
        <div class="nh-vendor-grid nh-vendor-grid-hero" id="nh-vendor-grid" role="radiogroup" aria-label="Vendor">
            {% for v in vendors %}
            <button type="button"
                    class="nh-vendor-card nh-vendor-card-hero{% if v.key == default_vendor %} selected{% endif %}"
                    data-vendor="{{ v.key }}"
                    aria-pressed="{{ 'true' if v.key == default_vendor else 'false' }}">
                <img src="/parameter_dictionary/static/images/{{ v.key }}_logo.png"
                     alt="{{ v.label }}" class="nh-vendor-logo nh-vendor-logo-lg">
                <span>{{ v.label }}</span>
            </button>
            {% endfor %}
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=3.5"></script>
    <script src="{{ url_for('network_health.static', filename='network_health_select.js') }}?v=2.0"></script>
    <script>
    async function logout() {
        try { await fetch('/api/logout', { method: 'POST' }); } catch (_) {}
        window.location.href = '/login';
    }
    </script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=1fdcccc0-d74b-4537-ad5c-5b4f96468180"></script>
<!-- impeccable-live-end -->
</body>
</html>
