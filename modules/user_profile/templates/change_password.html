<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusCore - Change Password</title>
    <link rel="icon" type="image/png" href="/static/images/favicon-nexuscore.png?v=1" data-page-favicon>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v=1.6">
    <style>
        .pw-strength {
            margin-top: 8px;
            height: 4px;
            border-radius: 999px;
            background: rgba(143, 177, 202, 0.25);
            overflow: hidden;
        }
        .pw-strength-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            transition: width 0.2s ease, background 0.2s ease;
        }
        .pw-strength-label {
            display: block;
            margin-top: 6px;
            font-size: 0.78rem;
            color: var(--pn-muted);
            min-height: 1.1em;
        }
        .status-ok {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: rgba(39, 174, 96, 0.15);
            border: 1px solid rgba(39, 174, 96, 0.4);
            color: #7dcea0;
            font-size: 0.9rem;
        }
        .auth-card .btn-secondary-link {
            display: inline-block;
            margin-top: 14px;
            background: transparent;
            border: none;
            color: var(--pn-muted);
            font: inherit;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .auth-card .btn-secondary-link:hover {
            color: var(--pn-ink);
        }
    </style>
</head>
<body class="auth-page change-password-page"
      data-post-change-redirect="{{ post_change_redirect }}">
    {% include "_elegant_gradient_bg.html" %}
    <canvas id="constellation-canvas" aria-hidden="true"></canvas>
    <div class="hud-overlay" aria-hidden="true"></div>
    <div class="login-theme-mount" aria-label="Theme controls"></div>

    <main class="login-shell login-shell-centered">
        <section class="brand-pane" aria-label="NexusCore branding">
            <div class="brand-lockup">
                <img src="/static/images/nexuscore-logo.png?v=1" alt="NexusCore logo" class="brand-logo">
                <div>
                    <div class="brand-name">NexusCore</div>
                    <div class="brand-sub">Unified Telecom &amp; ISP Platform</div>
                </div>
            </div>
        </section>

        <section class="card-pane">
            <form id="change-password-form" class="auth-card" autocomplete="on">
                <h2>Change Password</h2>
                <p class="card-sub">
                    Signed in as <strong>{{ user.username }}</strong>.
                    Update your password to continue into the platform.
                </p>

                <div class="form-group">
                    <label for="currentPassword">Current password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
                        <input type="password" id="currentPassword" name="current_password" required autofocus autocomplete="current-password" placeholder="••••••••">
                    </div>
                </div>

                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
                        <input type="password" id="newPassword" name="new_password" required minlength="6" autocomplete="new-password" placeholder="Min. 6 characters">
                    </div>
                    <div class="pw-strength" aria-hidden="true"><div class="pw-strength-fill" id="strengthFill"></div></div>
                    <small class="pw-strength-label" id="strengthLabel"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="input-wrap">
                        <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
                        <input type="password" id="confirmPassword" name="confirm_password" required minlength="6" autocomplete="new-password" placeholder="Repeat new password">
                    </div>
                </div>

                <div id="error-message" class="error-message" role="alert"></div>
                <div id="success-message" class="status-ok" role="status"></div>

                <button type="submit" class="btn-signin" id="submit-btn">
                    <span class="btn-ping" aria-hidden="true"></span><span class="btn-label">Update Password</span>
                </button>

                <button type="button" class="btn-secondary-link" id="logout-btn">Sign out instead</button>

                <div class="card-footer-line" aria-hidden="true">
                    <span>PASSWORD GATE</span>
                    <span>SECURE LINK</span>
                </div>
            </form>
        </section>
    </main>

    <div class="page-credit">Developed by Malek Mohammad</div>

    <script src="{{ url_for('static', filename='js/constellation.js') }}?v=2.3"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}?v=3.2"></script>
    <script src="{{ url_for('user_profile.static', filename='change_password.js') }}?v=1.0"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=1fdcccc0-d74b-4537-ad5c-5b4f96468180"></script>
<!-- impeccable-live-end -->
</body>
</html>
