<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeNet - Adjacency GIS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=2.2">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="{{ url_for('adjacency_gis.static', filename='adjacency_gis.css') }}?v=2.5">
</head>
<body class="map-page adjacency-gis-page">
    <header class="map-header">
        <div class="header-left">
            <button onclick="window.location.href='/dashboard'" class="btn-dashboard">Dashboard</button>
        </div>
        <div class="header-center">
            <h1>Adjacency GIS</h1>
            <p class="header-subtitle">2G BCCH reuse &amp; adjacent channels</p>
        </div>
        <div class="header-right" aria-label="Sites on map and user">
            <div class="header-sites-stat">
                <span class="header-sites-value" id="sites-count">0</span>
                <span class="header-sites-label">2G Sites</span>
            </div>
            <span class="user-name">{{ user.username }}</span>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </header>

    <div class="map-body map-body-float">
        <div id="network-map"></div>

        <aside class="map-filter-float" id="map-filter-float" aria-label="Map filters">
            <div class="map-filter-float-head">
                <span class="map-filter-float-title">Filters</span>
                <button type="button" class="map-filter-float-toggle" id="map-filter-float-toggle"
                        aria-expanded="true" aria-controls="map-filter-float-body"
                        title="Collapse filters" onclick="toggleMapFilterFloat()">‹</button>
            </div>
            <div class="map-filter-float-body" id="map-filter-float-body">
                <div id="tech-filter" class="tech-filter"></div>
                <div class="map-controls">
                    <input type="text" id="site-search" placeholder="Search sites..." onkeyup="searchSites()">
                    <div class="coord-search-row">
                        <input type="number" id="coord-lat" placeholder="Lat" step="0.000001">
                        <input type="number" id="coord-lng" placeholder="Lng" step="0.000001">
                        <button class="coord-go-btn" onclick="goToCoordinates()" title="Go to coordinates">Go</button>
                        <button class="coord-go-btn coord-nearest-btn"
                                onclick="showNearestSitesFromCoordinates()"
                                title="Show nearest sites to coordinates">
                            Nearest
                        </button>
                    </div>
                    <div class="code-search-row">
                        <input type="number" id="cell-code-search" placeholder="BCCH..."
                               min="0" oninput="cellCodeSearch()">
                        <button class="clear-code-btn" onclick="clearCodeSearch()" title="Clear code search">✕</button>
                    </div>
                    <select id="vendor-filter" onchange="filterByVendor()"
                            title="Filter sites by vendor">
                        <option value="all">All Vendors</option>
                        <option value="Nokia">Nokia</option>
                        <option value="Huawei">Huawei</option>
                    </select>
                    <select id="activity-filter" onchange="filterByActivity()"
                            title="Active sites only, or include offline 2G sites">
                        <option value="active" selected>Active only</option>
                        <option value="all">All sites</option>
                    </select>
                    <select id="area-filter" onchange="filterByArea()">
                        <option value="all">All Areas</option>
                    </select>
                    <select id="cluster-filter" onchange="filterByCluster()">
                        <option value="all">All Clusters</option>
                    </select>
                    <select id="tech-specific-filter" onchange="filterByTechSpecific()" style="display:none;">
                        <option value="all">All</option>
                    </select>

                    <button id="refresh-btn" class="refresh-btn" onclick="refreshMetadata()"
                            title="Pull latest metadata from server">
                        ↻ Refresh Data
                    </button>
                    <button id="measure-btn" class="measure-btn" onclick="toggleMeasure()"
                            title="Click points on the map to measure distance">
                        📏 Measure Distance
                    </button>
                    <div class="polygon-tool-row">
                        <button id="polygon-draw-btn" class="polygon-draw-btn" onclick="togglePolygonDraw()"
                                title="Draw a polygon on the map, then click it to extract sites/cells inside">
                            ⬠ Draw Polygon
                        </button>
                        <select id="polygon-layer-select" class="polygon-layer-select"
                                title="Layer to extract when clicking the polygon">
                            <option value="sites">Sites</option>
                            <option value="cells">Cells</option>
                        </select>
                        <button id="polygon-clear-btn" class="polygon-clear-btn" onclick="clearSelectionPolygon()"
                                title="Remove drawn polygon" style="display:none;">
                            ✕
                        </button>
                        <button id="polygon-extract-btn" class="polygon-extract-btn" onclick="extractFromCurrentPolygon()"
                                title="Download Excel of sites/cells inside the drawn polygon"
                                style="display:none;">
                            Export Excel
                        </button>
                        <button id="polygon-selection-btn" class="polygon-extract-btn" onclick="sendPolygonToSelection()"
                                title="Send cells/sites inside the polygon to shared selection"
                                style="display:none;">
                            Use as selection
                        </button>
                    </div>
                    <button class="export-excel-btn" onclick="exportCurrentView('excel')"
                            title="Export current filter / search result to Excel">
                        ⬇ Export Excel
                    </button>
                    <button class="export-kml-btn" onclick="exportCurrentView('kml')"
                            title="Export current filter / search result to KML for Google Earth">
                        🌐 Export KML
                    </button>
                </div>
            </div>
        </aside>

        <aside class="bcch-float" id="bcch-audit-block" aria-label="BCCH adjacent channels">
            <div class="bcch-audit-title">BCCH adjacent channels</div>
            <select id="bcch-select" onchange="onBcchSelectChange()"
                    title="Highlight co-channel (red) and ±1 adjacent BCCHs">
                <option value="">Select BCCH…</option>
            </select>
            <div class="bcch-stepper" role="group" aria-label="Step BCCH">
                <button type="button" class="bcch-step-btn" id="bcch-prev-btn"
                        onclick="stepBcch(-1)" title="Previous BCCH (ARFCN − 1)">‹</button>
                <span class="bcch-step-label" id="bcch-step-label">—</span>
                <button type="button" class="bcch-step-btn" id="bcch-next-btn"
                        onclick="stepBcch(1)" title="Next BCCH (ARFCN + 1)">›</button>
            </div>
            <div class="bcch-legend" id="bcch-legend" aria-hidden="true">
                <span><i class="bcch-swatch selected"></i> Selected</span>
                <span><i class="bcch-swatch lower"></i> Lower (−1)</span>
                <span><i class="bcch-swatch upper"></i> Upper (+1)</span>
            </div>
            <div class="bcch-counts" id="bcch-counts"></div>
            <button type="button" class="bcch-clear-btn" id="bcch-clear-btn"
                    onclick="clearBcchHighlight()" style="display:none;">
                Clear BCCH highlight
            </button>
        </aside>

        <div id="site-info-panel" class="site-info-float" style="display: none;"></div>
    </div>

    <div id="kpi-modal">
        <div id="kpi-content">
            <span class="close-modal" onclick="closeKPIModal()">&times;</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=3.2"></script>
    <script src="{{ url_for('static', filename='js/selection_context.js') }}?v=1.0"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('adjacency_gis.static', filename='adjacency_gis.js') }}?v=2.8"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initializeMap();
        });
    </script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=1fdcccc0-d74b-4537-ad5c-5b4f96468180"></script>
<!-- impeccable-live-end -->
</body>
</html>
