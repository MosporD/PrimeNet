<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parameter Dictionary - Nokia NCM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}?v=1.0">
    <link rel="stylesheet" href="{{ url_for('parameter_dictionary.static', filename='parameter_dictionary.css') }}?v=1.2">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a href="/dashboard" class="back-link">← Dashboard</a>
                    <h1>📚 Parameter Dictionary</h1>
                    <p>Browse and search Nokia MO parameters database</p>
                </div>
                <div class="header-right">
                    <span class="user-name">{{ user.username }}</span>
                    <button onclick="logout()" class="btn-logout">Logout</button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section id="vendor-gate" class="vendor-gate">
                <h2 class="vendor-gate-title">Select Vendor</h2>
                <p class="vendor-gate-subtitle">Choose which parameter library you want to open.</p>
                <div class="vendor-buttons">
                    <button type="button" id="vendor-nokia-btn" class="vendor-btn vendor-nokia">
                        <img src="{{ url_for('parameter_dictionary.static', filename='images/nokia_logo.png') }}?v=1" alt="Nokia logo" class="vendor-logo-img">
                        <span class="vendor-label">Nokia</span>
                    </button>
                    <button type="button" id="vendor-huawei-btn" class="vendor-btn vendor-huawei">
                        <img src="{{ url_for('parameter_dictionary.static', filename='images/huawei_logo.png') }}?v=1" alt="Huawei logo" class="vendor-logo-img">
                        <span class="vendor-label">Huawei</span>
                    </button>
                </div>
                <p id="vendor-coming-soon" class="vendor-coming-soon" style="display:none;">
                    Huawei parameter dictionary is coming soon.
                </p>
            </section>

            <div id="parameter-content" style="display:none;">
            <div class="search-section">
                <input type="text" id="search-input" placeholder="Search MO, parameter, or description..." class="search-box">
                <div class="filter-controls">
                    <select id="category-filter" class="filter-select">
                        <option value="">All Categories</option>
                    </select>
                    <select id="technology-filter" class="filter-select">
                        <option value="">All Technologies</option>
                        <option value="5G">5G</option>
                        <option value="LTE">LTE</option>
                        <option value="WCDMA">WCDMA</option>
                    </select>
                </div>
            </div>

            <div class="mo-stats-bar">
                <div class="mo-stat">
                    <div class="stat-value" id="total-mos">0</div>
                    <div class="stat-label">MO Classes</div>
                </div>
                <div class="mo-stat">
                    <div class="stat-value" id="total-params">0</div>
                    <div class="stat-label">Parameters</div>
                </div>
            </div>

            <div id="mo-list" class="mo-list"></div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/common.js') }}?v=1.0"></script>
    <script src="{{ url_for('parameter_dictionary.static', filename='parameter_dictionary.js') }}?v=1.2"></script>
</body>
</html>
